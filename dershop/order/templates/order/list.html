{% extends "../base/base.html" %}

{% block content %}
    <div class="container py-5">
        <div class="overflow-hidden card table-nowrap table-card">
            <div class="card-header d-flex justify-content-between align-items-center">

                <div>
                    <h5 class="mb-0" style="padding-top: 0.5rem">Order</h5>
                </div>
                <div>
                    <form hx-get="{% url 'order-list' %}" hx-target="#category-results"
                          hx-trigger="change, keyup delay:200ms from:input" method="get">
                        <div class="input-group">
                            <input type="text" class="form-control" name="q" placeholder="Search for..."
                                   aria-label="Search for..." value="{{ request.GET.q }}">
                            <select class="form-select" name="status">
                                <option value="">- Status -</option>
                                {% for key,status in status_choices %}
                                    <option value="{{ key }}"
                                        {% if request.GET.status == key %} selected {% endif %}
                                    >
                                        {{ status }}
                                    </option>
                                {% endfor %}
                            </select>
                            <button class="btn btn-outline-secondary" type="submit" id="button-addon2">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="order_results">
                {% include "./table.html" %}
            </div>

            {% if page_obj is not null %}
                {% include "../base/pagination.html" with page_obj=page_obj %}
            {% endif %}
        </div>
    </div>

    <div id="modal_view"
         class="modal modal-blur fade"
         style="display: none"
         aria-hidden="false"
         tabindex="-1"
    >
        <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
            <div class="modal-content"></div>
        </div>
    </div>
{% endblock %}
