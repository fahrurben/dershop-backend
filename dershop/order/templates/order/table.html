{% load custom_tags %}
<table class="table mb-0 table-striped">
    <thead>
    <tr>
        <th scope="col">No</th>
        <th scope="col">Date</th>
        <th scope="col">Customer</th>
        <th scope="col">Total</th>
        <th scope="col">Status</th>
        <th scope="col" class="text-center">Action</th>
    </tr>
    </thead>
    <tbody>
    {% for order in orders %}
        <tr id="item-{{ order.id }}">
            <td>{{ order.no }}</td>
            <td>{{ order.created_at }}</td>
            <td>{{ order.customer.full_name }}</td>
            <td>{% format_amount order.total_amount %}</td>
            <td>{{ order.get_status_display }}</td>
            <td align="center">
                <button type="button" class="btn btn-sm btn-primary"
                        hx-get="{% url 'order-view-modal' order.id %}"
                        hx-target="#modal_view"
                        hx-swap="innerHTML"
                        data-bs-toggle="modal"
                        data-bs-target="#modal_view">
                    <i class="bi bi-file-earmark-text-fill"></i> View
                </button>
                <button type="button" class="btn btn-sm btn-success"
                        hx-get="{% url 'order-edit-modal' order.id %}"
                        hx-target="#modal_edit"
                        hx-swap="innerHTML"
                        data-bs-toggle="modal"
                        data-bs-target="#modal_edit">
                    <i class="bi bi-pencil-square"></i> Update
                </button>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
