{% load static %}
{% load django_htmx %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %} {% endblock %}</title>
    {% htmx_script %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>


{% block content %}
{% endblock %}

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastPlacement">
    {% for message in messages %}
        <div class="toast align-items-center text-white {% if message.tags == 'success' %}bg-success{% else %}bg-danger{% endif %} border-0"
             role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    {{ message }}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
            </div>
        </div>
    {% endfor %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
<script>
  document.body.addEventListener('htmx:configRequest', (event) => {
    event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
  })

  // Function to initialize and show all untriggered toasts in DOM
  function showToasts() {
    const toastElList = document.querySelectorAll('.toast:not(.show)');
    toastElList.forEach(toastEl => {
      const toast = new bootstrap.Toast(toastEl, {autohide: true, delay: 4000});
      toast.show();
    });
  }

  document.addEventListener('DOMContentLoaded', showToasts);

  document.body.addEventListener('htmx:confirm', function (evt) {
    // Only intercept elements that have custom swal attributes
    if (evt.target.matches('[data-swal-title]')) {
      evt.preventDefault(); // Stop the standard HTMX execution path

      Swal.fire({
        title: evt.target.getAttribute('data-swal-title'),
        text: evt.target.getAttribute('data-swal-text'),
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!'
      }).then(function (result) {
        if (result.isConfirmed) {
          evt.detail.issueRequest(); // Manually resume the HTMX request
        }
      });
    }
  });
</script>
</body>

</html>
