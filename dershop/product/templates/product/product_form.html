<form hx-post="{% url 'product-create' %}" hx-encoding="multipart/form-data">
    {% csrf_token %}

    <!-- Global non-field errors (e.g., unique constraints) -->
    {{ form.non_field_errors }}

    {% for field in form %}
        <div class="mb-3">
            <!-- Label tag with automatic CSS assignment -->
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>

            <!-- Render the input field itself -->
            {{ field }}

            <!-- Individual field errors -->
            {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
            {% endif %}
        </div>
    {% endfor %}

    <h3>Images</h3>
    {{ formset.management_form }}

    <div id="image-form-list">
        {% for inline_form in formset %}
            <div class="image-form-row">
                {{ inline_form.as_p }}
                <hr>
            </div>
        {% endfor %}
    </div>

    <div class="d-flex flex-row-reverse gap-2">
        <button class="btn btn-primary" type="submit">Save</button>
        <a href="{% url 'product-list' %}" type="button" class="btn btn-secondary">Back</a>
    </div>
</form>
