{% extends "../base/base.html" %}

{% block content %}
    <div class="container py-5">
        <div class="overflow-hidden card table-nowrap table-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div class="d-flex">
                    <h5 class="mb-0" style="padding-top: 0.5rem">Category</h5>
                    <button type="button" class="btn btn-sm"
                            hx-get="/backend/category/modal-create/"
                            hx-target="#modal_create"
                            hx-swap="innerHTML"
                            data-bs-toggle="modal"
                            data-bs-target="#modal_create"
                    >
                        <i class="bi bi-plus-circle-fill" style="font-size: 1.5rem; color: cornflowerblue;"></i>
                    </button>
                </div>
                <div>
                    <form hx-get="{% url 'product-list' %}" hx-target="#category-results"
                          hx-trigger="change, keyup delay:200ms from:input" method="get">
                        <div class="input-group">
                            <input type="text" class="form-control" name="q" placeholder="Search for..."
                                   aria-label="Search for..." value="{{ request.GET.q }}">
                            <button class="btn btn-outline-secondary" type="submit" id="button-addon2">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            <div id="category_results">
                {% include "./table.html" %}
            </div>

            {% if page_obj is not null %}
                {% include "../base/pagination.html" with page_obj=page_obj %}
            {% endif %}

        </div>
    </div>
    <div id="modal_create"
         class="modal modal-blur fade"
         style="display: none"
         aria-hidden="false"
         tabindex="-1"
    >
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content"></div>
        </div>
    </div>

    <div id="modal_edit"
         class="modal modal-blur fade"
         style="display: none"
         aria-hidden="false"
         tabindex="-1"
    >
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content"></div>
        </div>
    </div>
{% endblock %}
